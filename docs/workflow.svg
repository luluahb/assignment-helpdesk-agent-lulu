<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="920" fill="#ffffff"/>

  <g fill="none" stroke="#000" stroke-width="1.5">
    <!-- Groups -->
    <rect x="300" y="190" width="345" height="290" fill="#f2f2f2"/>
    <rect x="680" y="290" width="200" height="180" fill="#f2f2f2"/>
    <rect x="40" y="490" width="220" height="330" fill="#f2f2f2"/>

    <!-- Nodes -->
    <rect x="370" y="20" width="160" height="40" fill="#fff"/>
    <polygon points="450,95 535,130 450,165 365,130" fill="#fff"/>
    <rect x="640" y="110" width="130" height="40" fill="#fff"/>

    <polygon points="450,215 545,245 450,275 355,245" fill="#fff"/>
    <polygon points="450,305 545,335 450,365 355,335" fill="#fff"/>
    <polygon points="450,395 545,425 450,455 355,425" fill="#fff"/>

    <rect x="700" y="315" width="160" height="40" fill="#fff"/>
    <rect x="700" y="395" width="160" height="50" fill="#fff"/>

    <rect x="70" y="520" width="160" height="40" fill="#fff"/>
    <rect x="70" y="590" width="160" height="40" fill="#fff"/>
    <polygon points="150,660 230,695 150,730 70,695" fill="#fff"/>
    <rect x="70" y="760" width="160" height="40" fill="#fff"/>

    <rect x="330" y="675" width="160" height="40" fill="#fff"/>
    <rect x="540" y="545" width="160" height="50" fill="#fff"/>

    <rect x="40" y="850" width="840" height="44" fill="#fff"/>

    <!-- Edges -->
    <line x1="450" y1="60" x2="450" y2="95" marker-end="url(#arrow)"/>
    <line x1="535" y1="130" x2="640" y2="130" marker-end="url(#arrow)"/>
    <line x1="450" y1="165" x2="450" y2="215" marker-end="url(#arrow)"/>
    <line x1="450" y1="275" x2="450" y2="305" marker-end="url(#arrow)"/>
    <line x1="450" y1="365" x2="450" y2="395" marker-end="url(#arrow)"/>

    <!-- Router -> Tool Call (bus) -->
    <line x1="545" y1="245" x2="662" y2="245"/>
    <line x1="545" y1="425" x2="662" y2="425"/>
    <line x1="662" y1="245" x2="662" y2="425"/>
    <line x1="545" y1="335" x2="700" y2="335" marker-end="url(#arrow)"/>
    <line x1="780" y1="355" x2="780" y2="395" marker-end="url(#arrow)"/>

    <!-- Router -> RAG -->
    <polyline points="355,425 150,425 150,520" marker-end="url(#arrow)"/>
    <line x1="150" y1="560" x2="150" y2="590" marker-end="url(#arrow)"/>
    <line x1="150" y1="630" x2="150" y2="660" marker-end="url(#arrow)"/>
    <line x1="150" y1="730" x2="150" y2="760" marker-end="url(#arrow)"/>
    <line x1="230" y1="695" x2="330" y2="695" marker-end="url(#arrow)"/>

    <!-- Router -> unknown -->
    <polyline points="450,455 450,510 620,510 620,545" marker-end="url(#arrow)"/>

    <!-- To response -->
    <line x1="150" y1="800" x2="150" y2="850" marker-end="url(#arrow)"/>
    <line x1="410" y1="715" x2="410" y2="850" marker-end="url(#arrow)"/>
    <line x1="620" y1="595" x2="620" y2="850" marker-end="url(#arrow)"/>
    <line x1="780" y1="445" x2="780" y2="850" marker-end="url(#arrow)"/>
  </g>

  <g fill="#000">
    <!-- Group titles -->
    <text x="310" y="208" font-weight="bold">Router</text>
    <text x="690" y="308" font-weight="bold">Tool Call</text>
    <text x="50" y="508" font-weight="bold">RAG</text>

    <g text-anchor="middle" dominant-baseline="middle">
      <text x="450" y="40">POST /ask</text>
      <text x="450" y="130">Query valid?</text>
      <text x="705" y="130">Error 422</text>

      <text x="450" y="245">Ada ticket ID?</text>
      <text x="450" y="335">Keyword cek tiket?</text>
      <text x="450" y="425">LLM classifier</text>

      <text x="780" y="335">Ekstrak ticket ID</text>
      <text x="780" y="412">Lookup</text>
      <text x="780" y="430">mock_tickets.csv</text>

      <text x="150" y="540">Embedding query</text>
      <text x="150" y="610">FAISS top-3</text>
      <text x="150" y="695">Skor ≥ 0.65?</text>
      <text x="150" y="780">Prompt + Gemini LLM</text>

      <text x="410" y="695">Info tidak tersedia</text>
      <text x="620" y="562">Pesan di luar</text>
      <text x="620" y="580">cakupan</text>

      <text x="460" y="872">Response JSON: { status, intent, data }</text>
    </g>

    <!-- Edge labels -->
    <g font-size="13">
      <text x="560" y="122">Tidak</text>
      <text x="458" y="182">Ya</text>
      <text x="458" y="294">Tidak</text>
      <text x="458" y="384">Tidak</text>
      <text x="560" y="238">Ya</text>
      <text x="560" y="328">Ya</text>
      <text x="553" y="418">ticket_status</text>
      <text x="240" y="418">faq</text>
      <text x="458" y="500">unknown</text>
      <text x="158" y="750">Ya</text>
      <text x="274" y="688">Tidak</text>
    </g>
  </g>
</svg>
